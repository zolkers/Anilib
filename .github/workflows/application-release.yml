name: Publish Anilib applications

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"

permissions:
  contents: read

jobs:
  desktop:
    uses: ./.github/workflows/desktop-release.yml
    with:
      version: ${{ github.ref_name }}
      require-signing: true
    secrets: inherit
  android:
    uses: ./.github/workflows/android-release.yml
    with:
      version: ${{ github.ref_name }}
      version-code: ${{ github.run_number }}
      require-signing: true
    secrets: inherit
  publish:
    needs: [desktop, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      ANILIB_UPDATE_PRIVATE_KEY_BASE64: ${{ secrets.ANILIB_UPDATE_PRIVATE_KEY_BASE64 }}
    steps:
      - name: Download verified build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: release-artifacts
      - name: Verify checksums and prepare unique release assets
        shell: bash
        run: |
          mkdir release-assets
          for artifact in anilib-windows anilib-linux anilib-macos anilib-android; do
            directory="release-artifacts/$artifact"
            test -f "$directory/SHA256SUMS"
            (cd "$directory" && sha256sum --check SHA256SUMS)
            cp "$directory/SHA256SUMS" "release-assets/SHA256SUMS-${artifact#anilib-}.txt"
          done
          find release-artifacts -type f \
            \( -name '*.msi' -o -name '*.deb' -o -name '*.dmg' -o -name '*.apk' \) \
            -exec cp {} release-assets/ \;
          test "$(find release-assets -type f | wc -l)" -eq 8
      - name: Create signed in-application update manifest
        shell: bash
        env:
          REQUESTED_VERSION: ${{ github.ref_name }}
        run: |
          test -n "$ANILIB_UPDATE_PRIVATE_KEY_BASE64"
          TAG="v${REQUESTED_VERSION#v}"
          CHANNEL=stable
          [[ "$TAG" == *-beta.* ]] && CHANNEL=beta
          MANIFEST=release-assets/anilib-update.manifest
          printf 'format=anilib-update-v1\n' > "$MANIFEST"
          printf 'repository=zolkers/Anilib\n' >> "$MANIFEST"
          printf 'workflow=.github/workflows/application-release.yml\n' >> "$MANIFEST"
          printf 'version=%s\n' "$TAG" >> "$MANIFEST"
          printf 'channel=%s\n' "$CHANNEL" >> "$MANIFEST"
          printf 'commit=%s\n' "$GITHUB_SHA" >> "$MANIFEST"
          printf 'release=https://github.com/zolkers/Anilib/releases/tag/%s\n' "$TAG" >> "$MANIFEST"
          printf 'license=https://github.com/zolkers/Anilib/blob/%s/LICENSE\n' "$GITHUB_SHA" >> "$MANIFEST"
          add_artifact() {
            platform="$1"
            pattern="$2"
            file="$(find release-assets -maxdepth 1 -type f -name "$pattern" -print -quit)"
            test -n "$file"
            name="$(basename "$file")"
            size="$(wc -c < "$file" | tr -d ' ')"
            digest="$(sha256sum "$file" | cut -d ' ' -f 1)"
            printf 'artifact.%s=%s|%s|%s|https://github.com/zolkers/Anilib/releases/download/%s/%s\n' \
              "$platform" "$name" "$size" "$digest" "$TAG" "$name" >> "$MANIFEST"
          }
          add_artifact android '*.apk'
          add_artifact windows '*.msi'
          add_artifact linux '*.deb'
          add_artifact macos '*.dmg'
          KEY="$RUNNER_TEMP/anilib-update-private.pk8"
          SIGNATURE="$RUNNER_TEMP/anilib-update-manifest.signature"
          printf '%s' "$ANILIB_UPDATE_PRIVATE_KEY_BASE64" | base64 --decode > "$KEY"
          openssl pkeyutl -sign -rawin -keyform DER -inkey "$KEY" \
            -in "$MANIFEST" -out "$SIGNATURE"
          base64 -w 0 "$SIGNATURE" > release-assets/anilib-update.manifest.sig
          printf '\n' >> release-assets/anilib-update.manifest.sig
          rm -f "$KEY" "$SIGNATURE"
      - name: Sign build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            release-assets/*.msi
            release-assets/*.deb
            release-assets/*.dmg
            release-assets/*.apk
      - name: Publish immutable GitHub release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ github.ref_name }}
        run: |
          TAG="v${REQUESTED_VERSION#v}"
          git ls-remote --exit-code --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "refs/tags/$TAG"
          mapfile -t ASSETS < <(find release-assets -type f -print | sort)
          PRERELEASE=()
          [[ "$TAG" == *-beta.* ]] && PRERELEASE=(--prerelease)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes --title "Anilib $TAG" "${PRERELEASE[@]}" "${ASSETS[@]}"
