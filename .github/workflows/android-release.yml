name: Android release APK

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      version-code:
        required: true
        type: string
      require-signing:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: Numeric package version (MAJOR.MINOR.PATCH)
        required: true
        default: 0.1.0
      version-code:
        description: Positive Android version code
        required: true
        default: "1"
      require-signing:
        description: Require a production-signed APK
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANILIB_ANDROID_KEYSTORE_BASE64 }}
      ANILIB_ANDROID_KEYSTORE: ${{ github.workspace }}/.release/anilib-release.jks
      ANILIB_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANILIB_ANDROID_KEYSTORE_PASSWORD }}
      ANILIB_ANDROID_KEY_ALIAS: ${{ secrets.ANILIB_ANDROID_KEY_ALIAS }}
      ANILIB_ANDROID_KEY_PASSWORD: ${{ secrets.ANILIB_ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6.0.2
      - name: Install pinned Java
        uses: actions/setup-java@v5.6.0
        with:
          distribution: microsoft
          java-version: 21.0.10
          cache: gradle
      - name: Install pinned Android platform
        run: sdkmanager --install "platforms;android-37"
      - name: Validate production signing secrets
        if: inputs['require-signing']
        shell: bash
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANILIB_ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANILIB_ANDROID_KEY_ALIAS"
          test -n "$ANILIB_ANDROID_KEY_PASSWORD"
      - name: Restore release key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          mkdir -p .release
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANILIB_ANDROID_KEYSTORE"
      - name: Validate and package
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_VERSION_CODE: ${{ inputs.version-code }}
        run: |
          VERSION="${REQUESTED_VERSION#v}"
          ./gradlew --no-daemon --console=plain check \
            :Anilib:Platforms:Android:writeAndroidReleaseChecksums \
            -PanilibVersion="$VERSION" \
            -PanilibAndroidVersionName="$VERSION" \
            -PanilibAndroidVersionCode="$REQUESTED_VERSION_CODE"
      - name: Verify production APK signature
        if: inputs['require-signing']
        shell: bash
        run: |
          APK="$(find Anilib/Platforms/Android/build/outputs/apk/release -name '*.apk' -type f -print -quit)"
          test -n "$APK"
          [[ "$APK" != *-unsigned.apk ]]
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -f "$ANILIB_ANDROID_KEYSTORE"
      - name: Upload APK and checksums
        uses: actions/upload-artifact@v7.0.1
        with:
          name: anilib-android
          if-no-files-found: error
          path: |
            Anilib/Platforms/Android/build/outputs/apk/release/*.apk
            Anilib/Platforms/Android/build/release/SHA256SUMS
