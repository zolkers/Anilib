plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

def rxjavaOriginal = configurations.create('rxjavaOriginal') {
    transitive = false
}

def rxjavaModuleSource = layout.buildDirectory.file('generated/rxjava-module-info/module-info.java')
def generateRxjavaModuleInfo = tasks.register('generateRxjavaModuleInfo') {
    outputs.file(rxjavaModuleSource)
    doLast {
        File output = rxjavaModuleSource.get().asFile
        output.parentFile.mkdirs()
        output.setText('''module rxjava {
    requires transitive jdk.unsupported;

    exports rx;
    exports rx.annotations;
    exports rx.exceptions;
    exports rx.functions;
    exports rx.internal.observers;
    exports rx.internal.operators;
    exports rx.internal.producers;
    exports rx.internal.schedulers;
    exports rx.internal.subscriptions;
    exports rx.internal.util;
    exports rx.internal.util.atomic;
    exports rx.internal.util.unsafe;
    exports rx.observables;
    exports rx.observers;
    exports rx.plugins;
    exports rx.schedulers;
    exports rx.singles;
    exports rx.subjects;
    exports rx.subscriptions;
}
''', 'UTF-8')
    }
}

def compileRxjavaModuleInfo = tasks.register('compileRxjavaModuleInfo', JavaCompile) {
    dependsOn generateRxjavaModuleInfo
    source(rxjavaModuleSource)
    destinationDirectory = layout.buildDirectory.dir('classes/rxjava-module-info')
    classpath = files()
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    options.release = 21
    doFirst {
        options.compilerArgs.addAll([
                '--patch-module',
                "rxjava=${rxjavaOriginal.singleFile.absolutePath}"
        ])
    }
}

def rxjavaModuleJar = tasks.register('rxjavaModuleJar', Jar) {
    dependsOn compileRxjavaModuleInfo
    archiveBaseName = 'rxjava-module'
    archiveVersion = '1.3.8'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({ zipTree(rxjavaOriginal.singleFile) }) {
        exclude 'META-INF/MANIFEST.MF'
    }
    from compileRxjavaModuleInfo
}

dependencies {
    implementation project(':Anilib:Framework:Concurrency:Runtime')
    implementation 'de.femtopedia.dex2jar:dex-translator:2.4.38'
    implementation 'net.dongliu:apk-parser:2.6.10'
    implementation 'org.ow2.asm:asm:9.10.1'
    implementation 'org.ow2.asm:asm-commons:9.10.1'
    implementation 'org.ow2.asm:asm-tree:9.10.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json-jvm:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.10.2'
    implementation 'com.squareup.okhttp3:okhttp:5.4.0'
    implementation 'com.squareup.okhttp3:okhttp-brotli:5.4.0'
    implementation 'com.squareup.okhttp3:okhttp-zstd:5.4.0'
    add('rxjavaOriginal', 'io.reactivex:rxjava:1.3.8')
    implementation files(rxjavaModuleJar)
    implementation 'org.jsoup:jsoup:1.19.1'
}

application {
    mainModule = 'fr.vriege.anilib.platform.desktopextensionhost'
    mainClass = 'fr.vriege.anilib.platform.desktopextensionhost.DesktopExtensionHostMain'
    applicationDefaultJvmArgs = ['--add-modules=ALL-MODULE-PATH']
}

tasks.register('desktopExtensionHostSmoke', JavaExec) {
    group = 'verification'
    description = 'Starts the Anilib desktop extension host and verifies its loopback protocol.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'fr.vriege.anilib.platform.desktopextensionhost.DesktopExtensionHostSmoke'
}

tasks.register('desktopExtensionCompatibilitySmoke', JavaExec) {
    group = 'verification'
    description = 'Runs pinned, opt-in real manga and anime APK workflows through details and playback/reader data.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'fr.vriege.anilib.platform.desktopextensionhost.ExtensionCompatibilitySmoke'
    def mangaExtension = providers.gradleProperty('anilib.mangaExtension')
    def mangaPackage = providers.gradleProperty('anilib.mangaExtensionPackage')
    def mangaVersion = providers.gradleProperty('anilib.mangaExtensionVersion')
    def mangaSha256 = providers.gradleProperty('anilib.mangaExtensionSha256')
    def mangaRevision = providers.gradleProperty('anilib.mangaExtensionRevision')
    def animeExtension = providers.gradleProperty('anilib.animeExtension')
    def animePackage = providers.gradleProperty('anilib.animeExtensionPackage')
    def animeVersion = providers.gradleProperty('anilib.animeExtensionVersion')
    def animeSha256 = providers.gradleProperty('anilib.animeExtensionSha256')
    def animeRevision = providers.gradleProperty('anilib.animeExtensionRevision')
    onlyIf {
        [mangaExtension, mangaPackage, mangaVersion, mangaSha256, mangaRevision,
         animeExtension, animePackage, animeVersion, animeSha256, animeRevision].every { it.isPresent() }
    }
    doFirst {
        args mangaExtension.get(), mangaPackage.get(), mangaVersion.get(), mangaSha256.get(), mangaRevision.get(),
                animeExtension.get(), animePackage.get(), animeVersion.get(), animeSha256.get(), animeRevision.get()
    }
}

tasks.named('test') {
    failOnNoDiscoveredTests = false
}

tasks.named('check') {
    dependsOn tasks.named('desktopExtensionHostSmoke')
}
