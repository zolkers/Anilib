plugins {
    id 'application'
}

application {
    mainModule = 'fr.vriege.anilib.platform.desktopengine'
    mainClass = 'fr.vriege.anilib.platform.desktopengine.DesktopEngineMain'
}

tasks.register('desktopEngineSmoke', JavaExec) {
    group = 'verification'
    description = 'Starts the Anilib desktop engine and verifies its loopback protocol.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'fr.vriege.anilib.platform.desktopengine.DesktopEngineSmoke'
}

tasks.named('test') {
    failOnNoDiscoveredTests = false
}

tasks.named('check') {
    dependsOn tasks.named('desktopEngineSmoke')
}
