def packageVersionValue = providers.gradleProperty('anilibPackageVersion').orElse('1.0.4').get()
if (!(packageVersionValue ==~ /[0-9]+\.[0-9]+\.[0-9]+/)) {
    throw new GradleException('anilibPackageVersion must use MAJOR.MINOR.PATCH numeric form')
}
def windowsHost = System.getProperty('os.name', '').toLowerCase(Locale.ROOT).contains('windows')
def ffmpegVersion = 'n9.0.1-6-g9d4ca21220'
def ffmpegRelease = 'autobuild-2026-08-20-13-45'
def ffmpegArchiveName = "ffmpeg-${ffmpegVersion}-win64-lgpl-shared-9.0.zip"
def ffmpegArchiveSha256 = '138fe84aa6e4836920f615704115d7ecf4cfbfc20f9a3d5c60f27c1e604fc12b'
def ffmpegArchive = rootProject.layout.projectDirectory.file(".gradle/ffmpeg/${ffmpegArchiveName}")
def ffmpegAppResources = layout.buildDirectory.dir('generated/app-resources')
def ffmpegArchiveFiles = zipTree(ffmpegArchive).matching {
    include '**/bin/*.exe', '**/bin/*.dll', '**/LICENSE.txt'
}

def prepareBundledFfmpeg = windowsHost ? tasks.register('prepareBundledFfmpeg') {
    group = 'distribution'
    description = 'Downloads, verifies, and stages the pinned LGPL FFmpeg runtime for Windows packaging.'
    inputs.property('version', ffmpegVersion)
    inputs.property('sha256', ffmpegArchiveSha256)
    outputs.dir(ffmpegAppResources)
    doLast {
        File archive = ffmpegArchive.asFile
        if (!archive.isFile()) {
            archive.parentFile.mkdirs()
            File temporary = new File(archive.parentFile, "${archive.name}.tmp")
            temporary.delete()
            new URL("https://github.com/BtbN/FFmpeg-Builds/releases/download/${ffmpegRelease}/${ffmpegArchiveName}")
                    .withInputStream { input -> temporary.withOutputStream { output -> output << input } }
            temporary.renameTo(archive)
        }
        MessageDigest digest = MessageDigest.getInstance('SHA-256')
        archive.withInputStream { input ->
            byte[] buffer = new byte[8192]
            int count
            while ((count = input.read(buffer)) >= 0) {
                digest.update(buffer, 0, count)
            }
        }
        String actual = digest.digest().collect { value -> String.format('%02x', value & 0xff) }.join()
        if (actual != ffmpegArchiveSha256) {
            archive.delete()
            throw new GradleException("Bundled FFmpeg checksum mismatch: ${actual}")
        }
        File destination = ffmpegAppResources.get().asFile
        if (destination.exists()) {
            java.nio.file.Files.walk(destination.toPath()).withCloseable { paths ->
                paths.sorted(Comparator.reverseOrder()).forEach { entry -> java.nio.file.Files.delete(entry) }
            }
        }
        File binaryDirectory = new File(destination, 'common/ffmpeg/bin')
        binaryDirectory.mkdirs()
        Set<String> required = ['ffmpeg.exe', 'ffprobe.exe'] as Set
        Set<String> copied = [] as Set
        ffmpegArchiveFiles.files.each { source ->
            if (source.parentFile.name == 'bin') {
                if (source.name.endsWith('.dll') || required.contains(source.name)) {
                    java.nio.file.Files.copy(
                            source.toPath(),
                            new File(binaryDirectory, source.name).toPath(),
                            java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                    copied.add(source.name)
                }
            } else if (source.name == 'LICENSE.txt') {
                File license = new File(destination, 'common/ffmpeg/LICENSE.txt')
                license.parentFile.mkdirs()
                java.nio.file.Files.copy(
                        source.toPath(),
                        license.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
        }
        if (!copied.containsAll(required)) {
            throw new GradleException("Bundled FFmpeg archive does not contain ffmpeg.exe and ffprobe.exe")
        }
    }
} : null

compose.desktop {
    application {
        mainClass = 'fr.vriege.anilib.platform.desktop.ComposeDesktopMainKt'
        jvmArgs.addAll([
                '--add-opens=java.desktop/sun.awt=ALL-UNNAMED',
                '--add-opens=java.desktop/java.awt.peer=ALL-UNNAMED',
                "-Danilib.version=${rootProject.version}"
        ])
        nativeDistributions {
            if (windowsHost) {
                appResourcesRootDir.set(ffmpegAppResources)
            }
            packageName = 'Anilib'
            packageVersion = packageVersionValue
            description = 'Desktop anime and manga library, reader, and player'
            copyright = 'Copyright 2026 Victor Riegert'
            vendor = 'Anilib'
            licenseFile.set(rootProject.file('LICENSE'))
            includeAllModules = true
            targetFormats(
                    org.jetbrains.compose.desktop.application.dsl.TargetFormat.Dmg,
                    org.jetbrains.compose.desktop.application.dsl.TargetFormat.Msi,
                    org.jetbrains.compose.desktop.application.dsl.TargetFormat.Deb)
            windows {
                menuGroup = 'Anilib'
                perUserInstall = true
                installationPath = 'AnilibApp'
                upgradeUuid = '9f7e13a2-70b2-4d51-a105-d99bac900f78'
                iconFile.set(project.file('src/main/resources/assets/anilib-icon.ico'))
            }
            linux {
                packageName = 'anilib'
                appCategory = 'utils'
                appRelease = '1'
                iconFile.set(project.file('src/main/resources/assets/anilib-icon.png'))
            }
            macOS {
                bundleID = 'fr.vriege.anilib'
                appCategory = 'public.app-category.entertainment'
                iconFile.set(project.file('src/main/resources/assets/anilib-icon.icns'))
            }
        }
    }
}

if (windowsHost) {
    tasks.matching { task -> task.name == 'prepareAppResources' }.configureEach {
        dependsOn prepareBundledFfmpeg
    }
}

def safeUpgradeMsi = windowsHost ? tasks.register('packageSafeUpgradeMsi', Exec) {
    group = 'distribution'
    description = 'Patches the Windows MSI with pre-upgrade user-data migration.'
    dependsOn tasks.named('packageMsi')
    def patchScript = layout.projectDirectory.file('src/main/jpackage/windows/patch-safe-upgrade.ps1')
    def migrationScript = layout.projectDirectory.file('src/main/jpackage/windows/migrate-legacy-data.vbs')
    def installer = layout.buildDirectory.file("compose/binaries/main/msi/Anilib-${packageVersionValue}.msi")
    inputs.file(patchScript)
    inputs.file(migrationScript)
    inputs.file(installer)
    outputs.file(installer)
    outputs.upToDateWhen { false }
    executable 'powershell.exe'
    args '-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass',
            '-File', patchScript.asFile.absolutePath,
            '-MsiPath', installer.get().asFile.absolutePath,
            '-MigrationScriptPath', migrationScript.asFile.absolutePath
} : null

tasks.register('writeDesktopReleaseChecksums') {
    group = 'distribution'
    description = 'Builds the native package for this host and writes deterministic SHA-256 sums.'
    dependsOn windowsHost ? safeUpgradeMsi : tasks.named('packageDistributionForCurrentOS')
    def packageDirectory = layout.buildDirectory.dir('compose/binaries/main')
    def checksumFile = layout.buildDirectory.file('release/SHA256SUMS')
    inputs.files(fileTree(packageDirectory) {
        include '**/*.msi', '**/*.deb', '**/*.dmg'
    })
    outputs.file(checksumFile)
    doLast { task ->
        List<File> packages = task.inputs.files.files.sort { first, second -> first.name <=> second.name }
        if (packages.isEmpty()) {
            throw new GradleException('No desktop package was produced for the current operating system')
        }
        File output = task.outputs.files.singleFile
        output.parentFile.mkdirs()
        output.setText(packages.collect { artifact ->
            MessageDigest digest = MessageDigest.getInstance('SHA-256')
            artifact.withInputStream { input ->
                byte[] buffer = new byte[8192]
                int count
                while ((count = input.read(buffer)) >= 0) {
                    digest.update(buffer, 0, count)
                }
            }
            String hash = digest.digest().collect { value -> String.format('%02x', value & 0xff) }.join()
            return "${hash}  ${artifact.name}"
        }.join('\n') + '\n', 'UTF-8')
    }
}

def stagedDesktopInstallers = fileTree(layout.buildDirectory.dir('compose/binaries/main')) {
    include '**/*.msi', '**/*.deb', '**/*.dmg'
}

def stageDesktopReleaseFiles = tasks.register('stageDesktopReleaseFiles', Sync) {
    dependsOn tasks.named('writeDesktopReleaseChecksums')
    from(stagedDesktopInstallers) {
        eachFile { details ->
            details.path = details.name
        }
        includeEmptyDirs = false
    }
    from layout.buildDirectory.file('release/SHA256SUMS')
    into rootProject.layout.projectDirectory.dir('release')
}

def removeStagedDesktopInstallers = tasks.register('removeStagedDesktopInstallers', Delete) {
    dependsOn stageDesktopReleaseFiles
    delete stagedDesktopInstallers
}

tasks.register('stageDesktopRelease') {
    group = 'distribution'
    description = 'Publishes the current-host installer at the repository root and removes module copies.'
    dependsOn removeStagedDesktopInstallers
}
