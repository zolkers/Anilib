plugins {
    id 'org.jetbrains.kotlin.multiplatform'
    id 'com.android.kotlin.multiplatform.library'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.compose'
}

repositories {
    google()
    mavenCentral()
    maven { url = uri('https://jogamp.org/deployment/maven') }
}

kotlin {
    jvm('desktop') {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
        }
    }

    android {
        namespace = 'fr.vriege.anilib.platform.compose'
        compileSdk = 37
        minSdk = 26
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
        }
    }

    sourceSets {
        desktopMain {
            kotlin.srcDir('src/shared/kotlin')
            dependencies {
                implementation project(':Anilib:Features:Library:Api')
                implementation project(':Anilib:Features:Library:Ui')
                implementation project(':Anilib:Features:Discovery:Api')
                implementation project(':Anilib:Features:Discovery:Ui')
                implementation project(':Anilib:Features:ExtensionRepository:Api')
                implementation project(':Anilib:Features:ExtensionRepository:Ui')
                implementation project(':Anilib:Features:Source:Api')
                implementation project(':Anilib:Features:Network:Api')
                implementation project(':Anilib:Features:Settings:Api')
                implementation project(':Anilib:Features:Settings:Ui')
                implementation project(':Anilib:Features:Reader:Api')
                implementation project(':Anilib:Features:Reader:Ui')
                implementation project(':Anilib:Features:Player:Api')
                implementation project(':Anilib:Features:Player:Ui')
                implementation project(':Anilib:Features:Downloads:Api')
                implementation project(':Anilib:Features:Downloads:Ui')
                implementation project(':Anilib:Features:Backup:Api')
                implementation project(':Anilib:Features:Backup:Ui')
                implementation project(':Anilib:Features:Tracker:Ui')
                implementation project(':Anilib:Features:Tracker:Api')
                implementation project(':Anilib:Features:Updates:Api')
                implementation project(':Anilib:Features:Updates:Ui')
                implementation project(':Anilib:Features:ApplicationUpdate:Api')
                implementation project(':Anilib:Features:ApplicationUpdate:Ui')
                implementation project(':Anilib:Framework:Http:Runtime')
                implementation project(':Anilib:Framework:Http:Api')
                implementation compose.foundation
                implementation compose.material3
                implementation compose.materialIconsExtended
                implementation 'io.github.kdroidfilter:composemediaplayer:0.11.4'
                implementation 'io.github.kevinnzou:compose-webview-multiplatform:2.0.3'
            }
        }
        androidMain {
            kotlin.srcDir('src/shared/kotlin')
            dependencies {
                implementation project(':Anilib:Features:Library:Api')
                implementation project(':Anilib:Features:Library:Ui')
                implementation project(':Anilib:Features:Discovery:Api')
                implementation project(':Anilib:Features:Discovery:Ui')
                implementation project(':Anilib:Features:ExtensionRepository:Api')
                implementation project(':Anilib:Features:ExtensionRepository:Ui')
                implementation project(':Anilib:Features:Source:Api')
                implementation project(':Anilib:Features:Network:Api')
                implementation project(':Anilib:Features:Settings:Api')
                implementation project(':Anilib:Features:Settings:Ui')
                implementation project(':Anilib:Features:Reader:Api')
                implementation project(':Anilib:Features:Reader:Ui')
                implementation project(':Anilib:Features:Player:Api')
                implementation project(':Anilib:Features:Player:Ui')
                implementation project(':Anilib:Features:Downloads:Api')
                implementation project(':Anilib:Features:Downloads:Ui')
                implementation project(':Anilib:Features:Backup:Api')
                implementation project(':Anilib:Features:Backup:Ui')
                implementation project(':Anilib:Features:Tracker:Ui')
                implementation project(':Anilib:Features:Tracker:Api')
                implementation project(':Anilib:Features:Updates:Api')
                implementation project(':Anilib:Features:Updates:Ui')
                implementation project(':Anilib:Features:ApplicationUpdate:Api')
                implementation project(':Anilib:Features:ApplicationUpdate:Ui')
                implementation project(':Anilib:Framework:Http:Runtime')
                implementation project(':Anilib:Framework:Http:Api')
                implementation compose.foundation
                implementation compose.material3
                implementation compose.materialIconsExtended
                implementation 'io.github.kdroidfilter:composemediaplayer:0.11.4'
                implementation 'io.github.kevinnzou:compose-webview-multiplatform:2.0.3'
                implementation 'androidx.media3:media3-exoplayer-hls:1.10.1'
            }
        }
    }
}
