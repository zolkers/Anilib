plugins {
    id 'base'
    id 'org.jetbrains.compose' version '1.11.1' apply false
    id 'org.jetbrains.kotlin.jvm' version '2.4.10' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.10' apply false
}

group = 'fr.vriege.anilib'
version = providers.gradleProperty('anilibVersion').get()

subprojects {
    apply plugin: 'base'

    def platformManagedBuild = project.path == ':Anilib:Platforms:Compose'
    if (!platformManagedBuild) {
        apply plugin: 'java-library'
    }

    def moduleCoordinate = project.path.substring(1).replace(':', '-').toLowerCase(Locale.ROOT)
    group = "${rootProject.group}.${moduleCoordinate}"
    version = rootProject.version

    base {
        archivesName = moduleCoordinate
    }

    if (!platformManagedBuild) {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(21)
            }
            modularity.inferModulePath = true
            withSourcesJar()
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
        options.addBooleanOption('Xdoclint:all,-missing', true)
        options.tags = [
                'apiNote:a:API Note:',
                'implSpec:a:Implementation Requirements:',
                'implNote:a:Implementation Note:'
        ]
    }

    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }

    configurations.configureEach {
        resolutionStrategy.failOnDynamicVersions()
        resolutionStrategy.failOnChangingVersions()
    }
}

tasks.register('javaQuality') {
    group = 'verification'
    description = 'Runs the dependency-free AnilibJava repository quality checker.'
    dependsOn ':Anilib:Tooling:JavaQuality:run'
}

tasks.register('architectureTest') {
    group = 'verification'
    description = 'Exercises plugin graph, rollback, and standard-product architecture contracts.'
    dependsOn ':Anilib:Tooling:ArchitectureTests:run'
}

tasks.named('check') {
    dependsOn subprojects.collect { it.tasks.named('check') }
    dependsOn tasks.named('javaQuality')
    dependsOn tasks.named('architectureTest')
}
